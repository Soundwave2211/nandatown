# SPDX-License-Identifier: Apache-2.0
# Q4 delegated auth scenario:
# coordinator -> 3 intermediaries -> 12 leaves.
name: delegated_auth
description: "Delegatable auth tree with cascading revocation coverage."

tier: 1
seed: 42

agents:
  count: 16
  brain: state-machine
  roles:
    - name: coordinator
      count: 1
    - name: intermediary
      count: 3
    - name: leaf
      count: 12

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: delegatable
  trust: score_average
  payments: prepaid_credits
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1

task:
  type: delegated_auth
  config:
    root_agent: coordinator-0
    intermediaries:
      - intermediary-0
      - intermediary-1
      - intermediary-2
    leaves_per_intermediary: 4
    root_scopes: [admin, read, write, delegate]
    intermediary_scopes: [read, write, delegate]
    leaf_scopes: [read]
    root_ttl_seconds: 600
    intermediary_ttl_seconds: 300
    leaf_ttl_seconds: 120
    attacks:
      - scope_escalation
      - stale_parent
      - audience_confusion

duration: "ticks: 1000"

metrics:
  - message_count

output:
  trace: ./traces/delegated_auth.jsonl
